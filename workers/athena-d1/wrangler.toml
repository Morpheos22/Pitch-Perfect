name = "athena-d1"
main = "src/index.ts"
compatibility_date = "2026-09-16"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "pitchcoach-athena-d1"
database_id = "9aa57869-3ca8-417e-8c29-978068c47d88"

[vars]
ELEVENLABS_VOICE_ID = "21m00Tcm4TlvDq8ikWAM"
ELEVENLABS_MODEL_ID = "eleven_turbo_v2_5"
WEB_SEARCH_PROVIDER = "brave"
# Vision model for image analysis. Default is Llava 1.5 7B HF.
# Alternatives: @cf/unum/uform-gen2-qwen-500m (faster), @cf/meta/llama-3.2-11b-vision-instruct
VISION_MODEL = "@cf/llava-hf/llava-1.5-7b-hf"
# CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN must be set as secrets for
# the vision tool to use the REST API (recommended). Set with:
#   wrangler secret put CLOUDFLARE_ACCOUNT_ID
#   wrangler secret put CLOUDFLARE_API_TOKEN
# Without these, the vision tool falls back to the AI binding (may fail).
# Supabase URL is safe as a variable; keep service-role credentials in Wrangler secrets.
SUPABASE_URL = "https://iwbshmshegewmctfucaz.supabase.co"
# SUPABASE_SERVICE_ROLE_KEY must be set with: wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# SUPABASE_ANON_KEY may be used instead when only RLS-authorized reads are required.
# WEB_SEARCH_URL and WEB_SEARCH_API_KEY may be set as secrets/vars for Brave, Serper, Tavily, or a compatible endpoint.
# ELEVENLABS_API_KEY must be set with: wrangler secret put ELEVENLABS_API_KEY
# WEB_SEARCH_API_KEY should be set with: wrangler secret put WEB_SEARCH_API_KEY
